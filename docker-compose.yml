version: '3.8'

services:
  # Serviço do Banco de Dados (sem alterações)
  nexuscore-db:
    image: postgres:16
    container_name: nexuscore-db
    environment:
      - POSTGRES_DB=NexusCoreDb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    ports:
      - "5432:5432"
    volumes:
      - nexuscore-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Serviço da Aplicação Web (COM ALTERAÇÕES)
  nexuscore-webapp:
    container_name: nexuscore-webapp
    build:
      context: .
      dockerfile: Dockerfile
    # REMOVEMOS A SEÇÃO 'ports'. A aplicação não será mais exposta diretamente.
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=nexuscore-db;Port=5432;Database=NexusCoreDb;Username=admin;Password=admin
    depends_on:
      - nexuscore-db
    restart: on-failure
    volumes:
      - nexuscore-dataprotection-keys:/root/.aspnet/DataProtection-Keys
    networks:
      - caddy_network
    depends_on:
      nexuscore-db:
        condition: service_healthy

# Define os volumes nomeados
volumes:
  nexuscore-db-data:
  nexuscore-dataprotection-keys: {}

networks:
  caddy_network:
    external: true